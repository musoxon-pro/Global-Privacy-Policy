<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Global Privacy Policy</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #f8fafc 0%, #eef2ff 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
        }
        .container {
            background: white;
            max-width: 900px;
            width: 100%;
            border-radius: 28px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.08);
            padding: 2.5rem 2rem;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .badge {
            background: #eef2ff;
            color: #4f46e5;
            font-size: 0.7rem;
            font-weight: 600;
            padding: 0.25rem 0.8rem;
            border-radius: 20px;
        }
        .lang-selector {
            display: flex;
            gap: 0.5rem;
            background: #f1f5f9;
            padding: 0.25rem;
            border-radius: 12px;
        }
        .lang-btn {
            border: none;
            background: transparent;
            padding: 0.4rem 0.9rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 500;
            color: #64748b;
            transition: all 0.2s ease;
        }
        .lang-btn:hover { background: rgba(79,70,229,0.1); color: #4f46e5; }
        .lang-btn.active { background: #4f46e5; color: white; }
        h1 { font-size: 2.2rem; font-weight: 700; color: #0f172a; margin-bottom: 0.3rem; }
        .subtitle {
            font-size: 1.05rem;
            color: #475569;
            margin-bottom: 2rem;
            border-left: 4px solid #4f46e5;
            padding-left: 1rem;
        }
        .divider { height: 1px; background: #e9edf2; margin: 1.8rem 0; }
        .section-title {
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 1.2rem;
            color: #0f172a;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }
        .file-list { display: flex; flex-direction: column; gap: 0.7rem; }
        .file-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            background: #f8fafc;
            padding: 0.8rem 1rem;
            border-radius: 14px;
            border: 1px solid #eef2f6;
            transition: all 0.15s ease;
        }
        .file-item:hover {
            background: #f1f4f9;
            border-color: #d0d8e3;
            transform: translateX(4px);
        }
        .file-item a {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            text-decoration: none;
            color: inherit;
            width: 100%;
        }
        .file-item .icon { font-size: 1.3rem; width: 32px; text-align: center; }
        .file-item .file-name { font-weight: 500; color: #1e293b; flex: 1; }
        .file-item .file-path {
            font-size: 0.8rem;
            color: #64748b;
            background: #e9edf2;
            padding: 0.15rem 0.6rem;
            border-radius: 20px;
            font-family: 'SF Mono', monospace;
        }
        .file-item .arrow { color: #94a3b8; transition: all 0.2s ease; }
        .file-item a:hover .arrow { color: #4f46e5; transform: translateX(4px); }
        .loading { color: #94a3b8; text-align: center; padding: 2rem 0; }
        .info-box {
            background: #f1f5f9;
            border-radius: 16px;
            padding: 1.2rem 1.5rem;
            margin-top: 1.8rem;
            border-left: 4px solid #64748b;
        }
        .info-box p { font-size: 0.95rem; color: #334155; margin-bottom: 0.3rem; }
        .info-box .code {
            background: #e2e8f0;
            padding: 0.2rem 0.5rem;
            border-radius: 6px;
            font-family: 'SF Mono', monospace;
            font-size: 0.85rem;
            color: #0f172a;
        }
        .footer {
            margin-top: 2rem;
            font-size: 0.85rem;
            color: #94a3b8;
            text-align: center;
            border-top: 1px solid #eef2f6;
            padding-top: 1.5rem;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .file-count {
            background: #4f46e5;
            color: white;
            padding: 0.15rem 0.7rem;
            border-radius: 20px;
            font-size: 0.8rem;
        }
        .last-update {
            font-size: 0.7rem;
            color: #94a3b8;
        }
        .refresh-btn {
            background: #4f46e5;
            color: white;
            border: none;
            padding: 0.3rem 1rem;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.2s ease;
        }
        .refresh-btn:hover {
            background: #4338ca;
            transform: scale(1.05);
        }
        .refresh-btn:active {
            transform: scale(0.95);
        }
        @media (max-width: 600px) {
            .container { padding: 1.5rem 1rem; }
            h1 { font-size: 1.6rem; }
            .header { flex-direction: column; }
            .lang-selector { width: 100%; justify-content: stretch; }
            .lang-btn { flex: 1; text-align: center; }
            .file-item { flex-wrap: wrap; padding: 0.6rem 0.8rem; }
            .file-item .file-path { margin-left: auto; }
            .footer { flex-direction: column; text-align: center; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div>
                <div class="badge">🌍 Global Privacy Policy</div>
            </div>
            <div style="display:flex; gap:1rem; align-items:center; flex-wrap:wrap;">
                <button class="refresh-btn" onclick="loadFiles()">🔄 Yangilash</button>
                <div class="lang-selector">
                    <button class="lang-btn" data-lang="uz" onclick="changeLanguage('uz')">🇺🇿 O'zbek</button>
                    <button class="lang-btn" data-lang="ru" onclick="changeLanguage('ru')">🇷🇺 Русский</button>
                    <button class="lang-btn" data-lang="en" onclick="changeLanguage('en')">🇬🇧 English</button>
                </div>
            </div>
        </div>

        <div id="content">
            <h1 id="title">Maxfiylik Siyosati</h1>
            <div class="subtitle" id="subtitle">Barcha maxfiylik siyosati sahifalariga havolalar</div>
            <div class="divider"></div>
            <div class="section-title" id="sectionTitle">📁 Mavjud sahifalar</div>
            <div id="fileList" class="file-list">
                <div class="loading" id="loadingMessage">⏳ Yuklanmoqda...</div>
            </div>
            <div class="info-box" id="infoBox">
                <p>📌 <strong id="infoTitle">Qo'llanma:</strong></p>
                <p id="infoText">
                    Loyiha <span class="code">Global-Privacy-Policy</span> GitHub repository'sidan avtomatik yuklanadi.
                </p>
            </div>
        </div>

        <div class="footer">
            <span>⚡ GitHub · Global Privacy Policy</span>
            <div style="display:flex; gap:1rem; align-items:center; flex-wrap:wrap;">
                <span class="last-update" id="lastUpdate">Oxirgi yangilanish: -</span>
                <span id="fileCount" class="file-count">0 ta fayl</span>
            </div>
        </div>
    </div>

    <script>
        // ==================== KONFIGURATSIYA ====================
        // GitHub repository ma'lumotlari
        const GITHUB_USER = 'musoxon-pro';
        const GITHUB_REPO = 'Global-Privacy-Policy';
        const GITHUB_BRANCH = 'main';
        const GITHUB_API = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents`;

        // ==================== TILLAR ====================
        const translations = {
            uz: {
                title: 'Maxfiylik Siyosati',
                subtitle: 'Barcha maxfiylik siyosati sahifalariga havolalar',
                sectionTitle: '📁 Mavjud sahifalar',
                infoTitle: "Qo'llanma:",
                infoText: `Loyiha <span class="code">${GITHUB_USER}/${GITHUB_REPO}</span> GitHub repository'sidan avtomatik yuklanadi.`,
                loading: '⏳ Yuklanmoqda...',
                noFiles: '📭 Hozircha hech qanday privacy policy fayli mavjud emas',
                error: '❌ Fayllarni yuklashda xatolik',
                fileCount: 'ta fayl',
                lastUpdate: 'Oxirgi yangilanish'
            },
            ru: {
                title: 'Политика Конфиденциальности',
                subtitle: 'Ссылки на все страницы политики конфиденциальности',
                sectionTitle: '📁 Доступные страницы',
                infoTitle: "Руководство:",
                infoText: `Проект автоматически загружается из репозитория <span class="code">${GITHUB_USER}/${GITHUB_REPO}</span> на GitHub.`,
                loading: '⏳ Загрузка...',
                noFiles: '📭 Пока нет ни одной страницы политики конфиденциальности',
                error: '❌ Ошибка при загрузке файлов',
                fileCount: 'файлов',
                lastUpdate: 'Последнее обновление'
            },
            en: {
                title: 'Privacy Policy',
                subtitle: 'Links to all privacy policy pages',
                sectionTitle: '📁 Available pages',
                infoTitle: "Guide:",
                infoText: `The project is automatically loaded from the <span class="code">${GITHUB_USER}/${GITHUB_REPO}</span> GitHub repository.`,
                loading: '⏳ Loading...',
                noFiles: '📭 No privacy policy files available yet',
                error: '❌ Error loading files',
                fileCount: 'files',
                lastUpdate: 'Last updated'
            }
        };

        let currentLang = 'uz';
        let allFiles = [];
        let fileData = {};

        // ==================== TILNI ANIQLASH ====================
        function detectLanguage() {
            const browserLang = navigator.language || navigator.languages?.[0] || 'uz';
            const lang = browserLang.split('-')[0].toLowerCase();
            if (lang === 'ru') return 'ru';
            if (lang === 'en') return 'en';
            return 'uz';
        }

        // ==================== TILNI O'ZGARTIRISH ====================
        function changeLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('preferredLang', lang);
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.lang === lang);
            });
            updateContent(lang);
            renderFiles(lang);
        }

        function updateContent(lang) {
            const t = translations[lang];
            document.getElementById('title').textContent = t.title;
            document.getElementById('subtitle').textContent = t.subtitle;
            document.getElementById('sectionTitle').textContent = t.sectionTitle;
            document.getElementById('infoTitle').textContent = t.infoTitle;
            document.getElementById('infoText').innerHTML = t.infoText;
            document.getElementById('fileCount').textContent = `${allFiles.length} ${t.fileCount}`;
        }

        // ==================== GITHUBDAN FAYLLARNI YUKLASH ====================
        async function loadFiles() {
            const list = document.getElementById('fileList');
            const t = translations[currentLang];
            
            list.innerHTML = `<div class="loading">${t.loading}</div>`;

            try {
                // GitHub API orqali repository contents ni olish
                const response = await fetch(GITHUB_API, {
                    headers: {
                        'Accept': 'application/vnd.github.v3+json'
                    }
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                
                // .html fayllarni filter qilish (index.html dan tashqari)
                const htmlFiles = data
                    .filter(item => item.name.endsWith('.html') && item.name !== 'index.html')
                    .map(item => ({
                        name: item.name,
                        path: item.path,
                        url: `https://${GITHUB_USER}.github.io/${GITHUB_REPO}/${item.name}`,
                        download_url: item.download_url,
                        size: item.size,
                        sha: item.sha
                    }))
                    .sort((a, b) => a.name.localeCompare(b.name));

                allFiles = htmlFiles;
                
                // Yangilangan vaqtni saqlash
                document.getElementById('lastUpdate').textContent = 
                    `${t.lastUpdate}: ${new Date().toLocaleString()}`;

                renderFiles(currentLang);
                updateContent(currentLang);

            } catch (error) {
                console.error('Yuklash xatoligi:', error);
                list.innerHTML = `
                    <div style="color:#ef4444; text-align:center; padding:1rem;">
                        ${t.error}
                        <br><br>
                        <button onclick="loadFiles()" style="
                            background:#4f46e5;
                            color:white;
                            border:none;
                            padding:0.5rem 1.5rem;
                            border-radius:8px;
                            cursor:pointer;
                            font-size:0.9rem;
                        ">🔄 Qayta urinib ko'rish</button>
                    </div>
                `;
            }
        }

        // ==================== FAYLLARNI KO'RSATISH ====================
        function renderFiles(lang) {
            const list = document.getElementById('fileList');
            const t = translations[lang];
            
            if (!allFiles || allFiles.length === 0) {
                list.innerHTML = `<div style="color:#94a3b8; text-align:center; padding:1rem;">${t.noFiles}</div>`;
                document.getElementById('fileCount').textContent = `0 ${t.fileCount}`;
                return;
            }

            list.innerHTML = allFiles.map(file => {
                const displayName = file.name.replace('.html', '').replace(/[-_]/g, ' ');
                return `
                    <div class="file-item" data-file="${file.name}">
                        <a href="${file.url}" target="_blank">
                            <span class="icon">📋</span>
                            <span class="file-name">${displayName}</span>
                            <span class="file-path">/${file.name}</span>
                            <span class="arrow">→</span>
                        </a>
                    </div>
                `;
            }).join('');
            
            document.getElementById('fileCount').textContent = `${allFiles.length} ${t.fileCount}`;
        }

        // ==================== AVTOMATIK YANGILANISH ====================
        // Har 30 sekundda yangilash
        let autoUpdateInterval = null;

        function startAutoUpdate() {
            if (autoUpdateInterval) {
                clearInterval(autoUpdateInterval);
            }
            autoUpdateInterval = setInterval(loadFiles, 30000); // 30 sekund
        }

        // ==================== BOSHLASH ====================
        async function init() {
            // Tilni sozlash
            const savedLang = localStorage.getItem('preferredLang');
            const detectedLang = savedLang || detectLanguage();
            currentLang = detectedLang;
            
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.lang === detectedLang);
            });
            
            updateContent(currentLang);
            
            // Fayllarni yuklash
            await loadFiles();
            
            // Avtomatik yangilanish
            startAutoUpdate();
        }

        document.addEventListener('DOMContentLoaded', init);

        // ==================== VISUAL EFFECTS ====================
        // Hover animatsiyasi
        document.addEventListener('mouseover', (e) => {
            const item = e.target.closest('.file-item');
            if (item) {
                item.style.transition = 'all 0.15s ease';
            }
        });
    </script>
</body>
</html>
